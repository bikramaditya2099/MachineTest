<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — JWT Auth System</title>
  <meta name="description" content="Secure login portal for JWT-based authentication system"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">🔐</div>
      <span class="brand-name">AuthSystem</span>
    </div>

    <!-- Heading -->
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <!-- Alert -->
    <div id="login-alert" class="alert"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            onclick="togglePassword('password','pwd-eye')"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;"
            id="pwd-eye"
            aria-label="Toggle password visibility"
          >👁️</button>
        </div>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="margin-top:8px;">
        <div class="spinner" aria-hidden="true"></div>
        Sign In
      </button>

    </form>

    <div class="divider">or</div>

    <div class="auth-footer">
      Don't have an account?
      <a href="register.html" class="auth-link">Create account →</a>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
  // Redirect to dashboard if already logged in
  redirectIfAuth();
</script>
</body>
</html>
